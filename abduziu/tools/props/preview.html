<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<style>body{margin:0;background:#1b2530;font:11px monospace;color:#cde}#g{display:grid;grid-template-columns:repeat(8,200px)}.c{position:relative;width:200px;height:200px}.c img{width:200px;height:200px;display:block}.c span{position:absolute;left:2px;top:2px;right:2px;background:#000a;padding:1px 3px;word-break:break-all}.c b{position:absolute;left:2px;bottom:2px;background:#000a;padding:1px 3px;font-weight:normal}</style></head>
<body><div id="g"></div><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const files = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(200, 200); r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x3a4a5a);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(3, 5, 4); scene.add(d);
const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 1000);
const loader = new GLTFLoader();
for (const f of files) {
  const div = document.createElement('div'); div.className = 'c';
  try {
    const g = await loader.loadAsync(f);
    const o = g.scene; scene.add(o);
    const box = new THREE.Box3().setFromObject(o); const s = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3());
    const rad = s.length() / 2 || 1;
    cam.position.set(c.x + rad * 1.9, c.y + rad * 1.4, c.z + rad * 2.4); cam.lookAt(c); cam.near = rad / 50; cam.far = rad * 20; cam.updateProjectionMatrix();
    r.render(scene, cam); scene.remove(o);
    const img = new Image(); img.src = r.domElement.toDataURL(); div.append(img);
    const b = document.createElement('b'); b.textContent = `${s.x.toFixed(2)}×${s.y.toFixed(2)}×${s.z.toFixed(2)}`; div.append(b);
  } catch (e) { div.append('ERR ' + e.message); }
  const sp = document.createElement('span'); sp.textContent = f.split('/').slice(-2).join('/').replace('.glb', ''); div.append(sp);
  document.getElementById('g').append(div);
}
document.title = 'ready';
</script></body></html>
