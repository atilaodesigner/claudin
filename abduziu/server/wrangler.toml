# ABDUZIU arena server: Durable Object rooms (SQLite-backed class, works on the free plan).
# The site reaches it through the Pages Function at /api/arena (see ../wrangler.toml).
name = "abduziu-arena"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ArenaRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArenaRoom"]
