<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ═══════════════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════════════
const CONFIG = {
  duration: 10,
  primaryColor: '#8CFF00',
  blockoutColor: '#777777',
  transformationStart: 5.5,
  transformationEnd: 9,
  particleCount: 1200,
  enableBloom: true,
  enableGrain: true,
  enableScanlines: false,
  cameraShake: 0.25,
  textLanguage: 'PT',
};

const RECORDING_MODE = true;

/**
 * GLBs reais da Tripo.
 * Troque null pela URL do .glb exportado na Tripo (mesma pasta do HTML ou URL https com CORS).
 * O modelo é centralizado, apoiado no chão e escalado para caber no volume do placeholder,
 * e herda o pipeline de transformação (wireframe → mesh → material → textura).
 * Frente do modelo virada para +Z.
 */
const ASSET_GLBS = {
  car: null, // ex.: 'tripo/car.glb'
  bus: null,
  slab: null, // bloco residencial sobre pilotis
  ministry: null,
  congress: null,
  lamp: null,
  tree: null,
  ipe: null,
  bench: null,
  bin: null,
  sign: null,
  cone: null,
  busstop: null,
  light: null,
  ufo: null,
};

const PARAMS = new URLSearchParams(location.search);
const CAPTURE = PARAMS.has('capture');
if (PARAMS.get('lang')) CONFIG.textLanguage = PARAMS.get('lang').toUpperCase() === 'EN' ? 'EN' : 'PT';
const GREEN = new THREE.Color(CONFIG.primaryColor);

const TEXT = {
  PT: {
    hl1: ['O GAME JÁ', 'FUNCIONAVA.'],
    hl2: ['MAS O MUNDO', 'AINDA ESTAVA', 'VAZIO.'],
    hl2sub: ['CARROS. PRÉDIOS. PROPS.', 'TUDO PRECISAVA DE <b>ASSETS 3D.</b>'],
    hl3: ['EU PRECISAVA', 'DE MUITOS', '<em>ASSETS 3D.</em>'],
    end: [{ t: 'O GAME JÁ EXISTIA.', s: 0.5 }, 'A <em>TRIPO</em> DEU UM', 'MUNDO PRA ELE.'],
    missing: 'ASSETS FALTANDO',
    generated: 'ASSETS GERADOS',
    hud: 'ABDUÇÕES',
    buildA: 'BUILD 0.3 · BLOCKOUT',
    buildB: 'BUILD 1.0 · ASSETS TRIPO',
  },
  EN: {
    hl1: ['THE GAME', 'WORKED.'],
    hl2: ['BUT THE WORLD', 'WAS STILL', 'EMPTY.'],
    hl2sub: ['CARS. BUILDINGS. PROPS.', 'EVERYTHING NEEDED <b>3D ASSETS.</b>'],
    hl3: ['I NEEDED', 'A LOT OF', '<em>3D ASSETS.</em>'],
    end: ['<em>TRIPO</em>', { t: 'TURNED THE BLOCKOUT', s: 0.62 }, 'INTO A WORLD.'],
    missing: 'MISSING ASSETS',
    generated: 'ASSETS GENERATED',
    hud: 'ABDUCTIONS',
    buildA: 'BUILD 0.3 · BLOCKOUT',
    buildB: 'BUILD 1.0 · TRIPO ASSETS',
  },
};
const L = TEXT[CONFIG.textLanguage];

// ═══════════════════════════════════════════════════════════════════════════
// MATH / TIME HELPERS (everything is a pure function of t, so any frame can be rendered exactly)
// ═══════════════════════════════════════════════════════════════════════════
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const sub = (t, a, b) => clamp((t - a) / (b - a));
const smooth = (k) => k * k * (3 - 2 * k);
const easeOutCubic = (k) => 1 - Math.pow(1 - k, 3);
const easeInCubic = (k) => k * k * k;
const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const easeOutExpo = (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
const easeOutBack = (k) => {
  const c = 1.9;
  return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2);
};
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let x = Math.imul(s ^ (s >>> 15), s | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// World time: slows to a near freeze for "the problem" beat, resumes when the scanner passes.
function timeScaleAt(t) {
  if (t < 3.9) return 1;
  if (t < 4.15) return lerp(1, 0.04, (t - 3.9) / 0.25);
  if (t < 5.7) return 0.04;
  if (t < 6.1) return lerp(0.04, 1, (t - 5.7) / 0.4);
  // payoff: the saucer brakes and hovers over the hero car
  if (t < 8.75) return 1;
  if (t < 9.25) return lerp(1, 0.16, easeInOut((t - 8.75) / 0.5));
  return 0.16;
}
const TAU_STEP = 0.002;
const TAU_TABLE = (() => {
  const out = [0];
  let acc = 0;
  for (let t = TAU_STEP; t <= 14 + 1e-9; t += TAU_STEP) {
    acc += timeScaleAt(t - TAU_STEP * 0.5) * TAU_STEP;
    out.push(acc);
  }
  return out;
})();
function tau(t) {
  if (t <= 0) return t;
  const f = t / TAU_STEP;
  const i = Math.min(TAU_TABLE.length - 2, Math.floor(f));
  return lerp(TAU_TABLE[i], TAU_TABLE[i + 1], f - i) + Math.max(0, t - 14);
}

// UFO path along the Eixo (flies toward -Z). x in the left carriageway, gentle swoops.
const ufoX = (T) => -6.5 + 1.8 * Math.sin(0.7 * T - 0.6);
const ufoZ = (T) => 38 - 13.5 * T;
function ufoY(t, T) {
  let y = 9.2 + 0.32 * Math.sin(2.1 * T + 0.3);
  y -= 1.1 * Math.sin(Math.PI * sub(t, 0.45, 2.2));
  y -= 1.9 * smooth(sub(t, 8.7, 9.5));
  return y;
}
function ufoPos(t, out) {
  const T = tau(t);
  return out.set(ufoX(T), ufoY(t, T), ufoZ(T));
}

// the render wave travels from the Congress (far -Z) toward the camera
function waveZ(t) {
  if (t < CONFIG.transformationStart) return -1e4;
  const k = sub(t, CONFIG.transformationStart, CONFIG.transformationEnd);
  return lerp(-575, 115, k * k * (3 - 2 * k) * 0.35 + k * 0.65);
}
// environment (sky, sun, grade) follows the wave
const envMix = (t) => easeInOut(sub(t, 6.1, 8.9));

// ═══════════════════════════════════════════════════════════════════════════
// RENDERER / STAGE
// ═══════════════════════════════════════════════════════════════════════════
const stage = document.getElementById('stage');
const glCanvas = document.getElementById('gl');
const fx = document.getElementById('fx');
const fxc = fx.getContext('2d');
const ui = document.getElementById('ui');

const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, 9 / 16, 0.5, 3000);

let W = 1080;
let H = 1920;
let U = 1; // css px per 1080p unit
function layout() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const w = Math.min(vw, (vh * 9) / 16);
  const h = (w * 16) / 9;
  stage.style.width = `${w}px`;
  stage.style.height = `${h}px`;
  U = h / 1920;
  document.documentElement.style.setProperty('--u', `${U}px`);
  const forced = PARAMS.get('res') === '1080';
  const pr = forced ? 1080 / w : Math.min(2, window.devicePixelRatio || 1);
  W = Math.round(w * pr);
  H = Math.round(h * pr);
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  fx.width = W;
  fx.height = H;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  if (typeof POINT_SCALE !== 'undefined') {
    POINT_SCALE.value = H * 0.47;
    POINT_MAX.value = H * 0.015;
  }
  composer?.setSize(W, H);
  bloom?.setSize(W, H);
}

// ═══════════════════════════════════════════════════════════════════════════
// SHARED TEXTURES
// ═══════════════════════════════════════════════════════════════════════════
function canvasTex(w, h, draw, repeat = false) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const detailTex = (() => {
  const t = canvasTex(256, 256, (g, w, h) => {
    const img = g.createImageData(w, h);
    const r = rng(7);
    // value noise, 3 octaves
    const oct = [8, 32, 64].map((s) => ({ s, v: Array.from({ length: s * s }, r) }));
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        let v = 0;
        let a = 0.5;
        for (const o of oct) {
          const fx0 = (x / w) * o.s;
          const fy0 = (y / h) * o.s;
          const x0 = Math.floor(fx0);
          const y0 = Math.floor(fy0);

        }

        const i = (y * w + x) * 4;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = n;
        img.data[i + 3] = 255;

// ═══════════════════════════════════════════════════════════════════════════
// GEOMETRY KIT: primitives → one merged geometry with vertex colors + emissive mask
// ═══════════════════════════════════════════════════════════════════════════
const _m4 = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _e = new THREE.Euler();
const _s = new THREE.Vector3();
const _p = new THREE.Vector3();
const _c = new THREE.Color();

class Kit {
  constructor() {
    this.parts = [];
  }
  add(geo, color, x, y, z, o = {}) {
    let g = geo.index ? geo.toNonIndexed() : geo;
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
    _e.set(o.rx || 0, o.ry || 0, o.rz || 0);
    _q.setFromEuler(_e);
    _s.set(o.sx ?? 1, o.sy ?? 1, o.sz ?? 1);
    _p.set(x, y, z);
    _m4.compose(_p, _q, _s);
    g.applyMatrix4(_m4);
    const n = g.attributes.position.count;
    _c.set(color);
    const col = new Float32Array(n * 3);
    const em = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      col[i * 3] = _c.r;
      col[i * 3 + 1] = _c.g;
      col[i * 3 + 2] = _c.b;
      em[i] = o.emit || 0;
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.setAttribute('aEmit', new THREE.BufferAttribute(em, 1));
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 2), 2));
    if (o.uvScale) {
      const uv = g.attributes.uv;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * o.uvScale[0], uv.getY(i) * o.uvScale[1]);
    }
    this.parts.push(g);
    return this;
  }
  box(w, h, d, c, x = 0, y = 0, z = 0, o) {
    return this.add(new THREE.BoxGeometry(w, h, d), c, x, y + h / 2, z, o);
  }
  cyl(rt, rb, h, seg, c, x = 0, y = 0, z = 0, o) {
    return this.add(new THREE.CylinderGeometry(rt, rb, h, seg), c, x, y + h / 2, z, o);
  }
  cone(r, h, seg, c, x = 0, y = 0, z = 0, o) {
    return this.add(new THREE.ConeGeometry(r, h, seg), c, x, y + h / 2, z, o);
  }
  sph(r, ws, hs, c, x = 0, y = 0, z = 0, o) {
    return this.add(new THREE.SphereGeometry(r, ws, hs), c, x, y, z, o);
  }
  ico(r, det, c, x = 0, y = 0, z = 0, o) {
    return this.add(new THREE.IcosahedronGeometry(r, det), c, x, y, z, o);
  }
  torus(R, r, rs, ts, c, x = 0, y = 0, z = 0, o) {
    return this.add(new THREE.TorusGeometry(R, r, rs, ts), c, x, y, z, o);
  }
  quad(w, h, c, x = 0, y = 0, z = 0, o) {
    return this.add(new THREE.PlaneGeometry(w, h), c, x, y, z, o);
  }
  strut(a, b, r, c, seg = 6) {
    const dir = new THREE.Vector3().subVectors(b, a);
    const len = dir.length();
    const g = new THREE.CylinderGeometry(r, r, len, seg);
    g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize()));
    return this.add(g, c, (a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2);
  }
  build() {
    if (!this.parts.length) return null;
    const g = mergeGeometries(this.parts, false);
    g.computeBoundingBox();
    g.computeBoundingSphere();
    return g;
  }
}

        .torus(3.12, 0.12, 8, 48, '#9aa6b2', 0, 0.02, 0, { rx: Math.PI / 2 })
        .sph(1.45, 28, 14, '#b8ffd2', 0, 0.62, 0, { emit: 0.55 })
        .cyl(1.5, 2.1, 0.32, 28, '#39424e', 0, -0.72, 0)
        .cyl(0.95, 0.95, 0.06, 24, '#8cff00', 0, -0.78, 0, { emit: 2.4 });
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        k.sph(0.16, 8, 6, i % 2 ? '#ffd23f' : '#8cff00', Math.cos(a) * 2.95, 0.02, Math.sin(a) * 2.95, { emit: 2.2 });
      }
    },
    opts: { roughness: 0.22, metalness: 0.75 },
  },
};

// geometry cache per type/variant
const GEO = {};
function geoFor(type, variant) {
  const key = `${type}:${variant}`;
  if (GEO[key]) return GEO[key];
  const def = LIBRARY[type];
  const bk = new Kit();
  def.blockout(bk);
  const blockout = bk.build();
  let solid;
  let tex;
  if (def.glb) {
    solid = def.glb.solid;
    tex = def.glb.tex;
  } else {
    const k = new Kit();
    const tk = new Kit();
    def.final(k, tk, variant);
    solid = k.build();
    tex = tk.build();
  }
  // surface samples for the point cloud (in final local space)
  const sampler = new MeshSurfaceSampler(new THREE.Mesh(solid)).build();
  const samples = [];
  const tmp = new THREE.Vector3();
  for (let i = 0; i < 64; i++) {
    sampler.sample(tmp);
    samples.push(tmp.clone());
  }
  const bb = blockout.boundingBox.clone();
  if (solid) bb.union(solid.boundingBox);
  const edges = new THREE.EdgesGeometry(solid, 28);
  GEO[key] = { blockout, solid, tex, edges, samples, bb, blockoutBB: blockout.boundingBox.clone() };
  return GEO[key];
}

/**
 * Loads a Tripo GLB and makes it the finished version of an asset type.
 * The mesh is merged, recentered on the ground and scaled to the placeholder volume,
 * so gameplay, collisions and the transformation pipeline keep working unchanged.
 */
async function loadFinalAsset(name, glbUrl) {
  const def = LIBRARY[name];
  if (!def || !glbUrl) return;
  const gltf = await new GLTFLoader().loadAsync(glbUrl);
  gltf.scene.updateMatrixWorld(true);
  const solids = [];
  const texParts = [];
  let map = null;
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    const g = o.geometry.clone().applyMatrix4(o.matrixWorld);
    const mat = Array.isArray(o.material) ? o.material[0] : o.material;
    const n = g.attributes.position.count;
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
    const gg = g.index ? g.toNonIndexed() : g;
    if (!gg.attributes.normal) gg.computeVertexNormals();
    if (!gg.attributes.uv) gg.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(gg.attributes.position.count * 2), 2));
    const c = mat?.color ? mat.color : new THREE.Color(1, 1, 1);
    const col = new Float32Array(gg.attributes.position.count * 3).fill(1);
    for (let i = 0; i < gg.attributes.position.count; i++) col.set([c.r, c.g, c.b], i * 3);
    gg.setAttribute('color', new THREE.BufferAttribute(col, 3));
    gg.setAttribute('aEmit', new THREE.BufferAttribute(new Float32Array(gg.attributes.position.count), 1));
    if (mat?.map) {
      map = map || mat.map;
      texParts.push(gg);
    } else solids.push(gg);
    void n;
  });
  const all = mergeGeometries([...solids, ...texParts], false);
  all.computeBoundingBox();
  // fit into the placeholder: same footprint and height, feet on the ground
  const bk = new Kit();
  def.blockout(bk);
  const target = bk.build().boundingBox;
  const src = all.boundingBox;
  const s = Math.min((target.max.x - target.min.x) / (src.max.x - src.min.x), (target.max.y - target.min.y) / (src.max.y - src.min.y), (target.max.z - target.min.z) / (src.max.z - src.min.z));
  const fit = (g) => {
    if (!g) return null;
    g.translate(-(src.min.x + src.max.x) / 2, -src.min.y, -(src.min.z + src.max.z) / 2);
    g.scale(s, s, s);
    g.computeBoundingBox();
    g.computeBoundingSphere();
    return g;
  };
  def.glb = {
    solid: fit(solids.length ? mergeGeometries(solids, false) : mergeGeometries(texParts, false)),
    tex: fit(solids.length && texParts.length ? mergeGeometries(texParts, false) : null),
  };
  if (map) def.tex = map;
  for (const k of Object.keys(GEO)) if (k.startsWith(`${name}:`)) delete GEO[k];
}

// ═══════════════════════════════════════════════════════════════════════════
// MATERIALS with the transformation built into the shader
// ═══════════════════════════════════════════════════════════════════════════
const SHARED = {
  uTime: { value: 0 },
  uDetail: { value: detailTex },
  uClay: { value: new THREE.Color('#b9bcbf') },
  uGreen: { value: GREEN.clone() },
};

const VERT_HEAD = /* glsl */ `
  varying vec3 vWPos;
  attribute float aEmit;
  varying float vEmit;
`;
function patchVertex(sh) {
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', `#include <common>\n${VERT_HEAD}`)
    .replace('#include <project_vertex>', `#include <project_vertex>\n  vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;\n  vEmit = aEmit;`);
}

/** Finished asset material: build clip (uScanY), clay→color (uMat), texture fade (uTex), front glow. */
function makeFinalMaterial(A, def, textured) {
  const m = new THREE.MeshStandardMaterial({
    vertexColors: true,
    map: textured ? def.tex : null,
    roughness: def.opts?.roughness ?? 0.6,
    metalness: def.opts?.metalness ?? 0,
  });
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { uScanY: A.u.uScanY, uMat: A.u.uMat, uTex: A.u.uTex, uGlow: A.u.uGlow, uFlash: A.u.uFlash, uBaseY: A.u.uBaseY, uDetail: SHARED.uDetail, uClay: SHARED.uClay, uGreen: SHARED.uGreen });
    patchVertex(sh);
    sh.fragmentShader = sh.fragmentShader
      .replace(
        '#include <common>',
        `#include <common>
        varying vec3 vWPos; varying float vEmit;
        uniform float uScanY, uMat, uTex, uGlow, uFlash, uBaseY;
        uniform sampler2D uDetail; uniform vec3 uClay, uGreen;`,
      )
      .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\n  if (vWPos.y > uScanY) discard;')
      .replace(
        '#include <map_fragment>',
        `#ifdef USE_MAP
          vec4 sampledDiffuseColor = texture2D( map, vMapUv );
          diffuseColor.rgb *= mix( vec3( 1.0 ), sampledDiffuseColor.rgb, uTex );
        #endif`,
      )
      .replace(
        '#include <color_fragment>',
        `#include <color_fragment>
        diffuseColor.rgb = mix( uClay, diffuseColor.rgb, uMat );
        float dn = texture2D( uDetail, vWPos.xz * 0.19 + vWPos.y * 0.07 ).r;
        diffuseColor.rgb *= mix( 1.0, 0.82 + 0.36 * dn, uTex * 0.5 );
        float aoF = mix( 0.62, 1.0, smoothstep( 0.0, 1.5, vWPos.y - uBaseY ) );
        diffuseColor.rgb *= mix( 1.0, aoF, uTex );`,
      )
      .replace(
        '#include <emissivemap_fragment>',
        `#include <emissivemap_fragment>
        float band = ( 1.0 - smoothstep( 0.0, 0.8, uScanY - vWPos.y ) ) * uGlow;
        totalEmissiveRadiance += uGreen * band * 2.4;
        totalEmissiveRadiance += diffuseColor.rgb * vEmit * 2.0 * uMat;
        totalEmissiveRadiance += mix( uGreen, vec3( 1.0 ), 0.4 ) * uFlash * 0.55;`,
      );
  };
  m.customProgramCacheKey = () => `final-${textured ? 1 : 0}`;
  return m;
}

/** Greybox material: flat editor grey, eaten from below (uCut), holographic scan while tagged. */
function makeBlockoutMaterial(A) {
  const m = new THREE.MeshStandardMaterial({ color: CONFIG.blockoutColor, roughness: 0.95, metalness: 0 });
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { uCut: A.u.uCut, uHolo: A.u.uHolo, uGlow: A.u.uGlow, uTime: SHARED.uTime, uGreen: SHARED.uGreen });
    patchVertex(sh);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>\n varying vec3 vWPos; varying float vEmit;\n uniform float uCut, uHolo, uGlow, uTime; uniform vec3 uGreen;`)
      .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\n  if (vWPos.y < uCut) discard;')
      .replace(
        '#include <emissivemap_fragment>',
        `#include <emissivemap_fragment>
        float edge = ( 1.0 - smoothstep( 0.0, 0.6, vWPos.y - uCut ) ) * uGlow;
        float ph = fract( vWPos.y * 1.6 - uTime * 2.6 );
        float lines = smoothstep( 0.0, 0.08, ph ) * ( 1.0 - smoothstep( 0.1, 0.22, ph ) );
        totalEmissiveRadiance += uGreen * ( edge * 2.2 + uHolo * ( 0.1 + 0.9 * lines ) );
        diffuseColor.rgb = mix( diffuseColor.rgb, diffuseColor.rgb * 0.55 + uGreen * 0.12, uHolo * 0.6 );`,
      );
  };
  m.customProgramCacheKey = () => 'blockout';
  return m;
}

/** Wireframe of the finished mesh, visible only in the band just above the build front. */
function makeWireMaterial(A) {
  return new THREE.ShaderMaterial({
    uniforms: { uLo: A.u.uWireLo, uHi: A.u.uWireHi, uOpacity: A.u.uWireA, uColor: SHARED.uGreen },
    vertexShader: /* glsl */ `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: /* glsl */ `uniform float uLo, uHi, uOpacity; uniform vec3 uColor; varying vec3 vW;
      void main(){ if (vW.y < uLo || vW.y > uHi) discard; float k = 1.0 - smoothstep(uLo, uHi, vW.y); float a = uOpacity * (0.35 + 0.65 * k); gl_FragColor = vec4(uColor * (1.0 + k), a); }`,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// ASSET INSTANCES
// ═══════════════════════════════════════════════════════════════════════════
const ASSETS = [];
class Asset {
  constructor(type, variant, x, z, rotY, opts = {}) {
    this.type = type;
    this.def = LIBRARY[type];
    this.variant = variant;
    this.root = new THREE.Group();
    this.root.position.set(x, opts.y || 0, z);
    this.root.rotation.y = rotY;
    this.hero = opts.hero || null;
    this.band = opts.band || 58;
    this.jitter = opts.jitter ?? 0;
    this.p = 0;
    this.forced = null;
    this.u = {
      uScanY: { value: -1e4 },
      uMat: { value: 0 },
      uTex: { value: 0 },
      uGlow: { value: 0 },
      uFlash: { value: 0 },
      uBaseY: { value: 0 },
      uCut: { value: -1e4 },
      uHolo: { value: 0 },
      uWireLo: { value: 0 },
      uWireHi: { value: 0 },
      uWireA: { value: 0 },
    };
    this.build();
    scene.add(this.root);
    ASSETS.push(this);
  }

  build() {
    this.root.clear();
    const g = geoFor(this.type, this.variant);
    this.g = g;
    this.blockout = new THREE.Mesh(g.blockout, makeBlockoutMaterial(this));
    this.blockout.castShadow = this.blockout.receiveShadow = true;
    this.final = new THREE.Group();
    const solid = new THREE.Mesh(g.solid, makeFinalMaterial(this, this.def, false));
    solid.castShadow = solid.receiveShadow = true;
    this.final.add(solid);
    if (g.tex && this.def.tex) {
      const tm = new THREE.Mesh(g.tex, makeFinalMaterial(this, this.def, true));
      tm.castShadow = tm.receiveShadow = true;
      this.final.add(tm);
    }
    this.wire = new THREE.LineSegments(g.edges, makeWireMaterial(this));
    this.wire.renderOrder = 3;
    this.root.add(this.blockout, this.final, this.wire);
    this.height = g.bb.max.y - Math.min(0, g.bb.min.y);
    this.minY = g.bb.min.y;
  }

  /** Farthest extent toward -Z in world space (where the wave hits first). */
  get zFront() {
    const r = Math.max(this.g.bb.max.x - this.g.bb.min.x, this.g.bb.max.z - this.g.bb.min.z) * 0.5;
    return this.root.position.z - r;
  }

  setProgress(p) {
    this.p = p;
    const u = this.u;
    const base = this.root.position.y + this.minY * this.root.scale.y;
    const top = base + this.height * this.root.scale.y;
    const hgt = top - base;
    u.uBaseY.value = base;
    const holo = sub(p, 0, 0.1) * (1 - sub(p, 0.28, 0.4));
    const build = easeInOut(sub(p, 0.1, 0.72));
    const scan = base - 0.25 + build * (hgt + 0.5);
    const lead = Math.max(0.6, hgt * 0.32);
    u.uHolo.value = holo;
    u.uScanY.value = p <= 0.1 ? -1e4 : scan;
    u.uCut.value = p <= 0.1 ? -1e4 : scan + lead;
    u.uWireLo.value = scan;
    u.uWireHi.value = scan + lead;
    u.uWireA.value = sub(p, 0.08, 0.16) * (1 - sub(p, 0.72, 0.84));
    u.uGlow.value = sub(p, 0.08, 0.14) * (1 - sub(p, 0.8, 0.95));
    u.uMat.value = sub(p, 0.48, 0.74);
    u.uTex.value = sub(p, 0.7, 0.93);
    const f = sub(p, 0.9, 1.0);
    u.uFlash.value = p >= 1 ? Math.max(0, 1 - (this.doneAge || 0) * 3.2) : f * 0.7;
    this.blockout.visible = u.uCut.value < top + 0.5;
    this.final.visible = p > 0.1;
    this.wire.visible = u.uWireA.value > 0.001;
    const pop = 1 + 0.06 * Math.sin(Math.PI * sub(p, 0.88, 1.0));
    this.final.scale.setScalar(pop);
  }
}

// CITY: Eixo Monumental-like avenue toward a Congress silhouette
// ═══════════════════════════════════════════════════════════════════════════
const R = rng(2026);
const MOVERS = []; // traffic: { a, x, z0, dir, v, zmin, zmax }
const HERO = {};
let firstCar;
let heroCar;
function buildCity() {
  // Congress at the end of the Eixo
  HERO.congress = new Asset('congress', 0, 0, -505, 0, { band: 140 });
  // Esplanada: ministries along both sides
  for (let k = 0; k < 6; k++)
    for (const s of [-1, 1]) {
      const a = new Asset('ministry', 0, s * 46, -150 - k * 58, 0, { band: 70, jitter: R() * 12 });
      if (k === 0 && s === -1) HERO.ministry = a;
    }
  // superquadras: slabs on pilotis on both sides near the start
  const slabs = [
    [40, 44, 0],
    [40, -16, Math.PI / 2],
    [42, -84, 0],
    [84, 30, Math.PI / 2],
    [86, -40, 0],
    [88, -110, Math.PI / 2],
  ];
  let v = 0;
  for (const [x, z, r] of slabs)
    for (const s of [-1, 1]) {
      const a = new Asset('slab', v++ % 4, s * x, z, r, { band: 64, jitter: R() * 10 });
      if (x === 42 && s === -1) HERO.slab = a;
    }
  // far outer blocks for depth
  for (let i = 0; i < 10; i++) {
    const s = i % 2 ? 1 : -1;
    new Asset('slab', i % 4, s * (130 + R() * 40), -170 - i * 34, R() < 0.5 ? 0 : Math.PI / 2, { band: 60 });
  }
  // lamps along both sidewalks
  for (let z = 70; z > -440; z -= 24)
    for (const s of [-1, 1]) {
      const a = new Asset('lamp', 0, s * 17, z, s > 0 ? -Math.PI / 2 : Math.PI / 2, { band: 40 });
      if (!HERO.lamp && s === 1 && z < -20) HERO.lamp = a;
    }
  // cerrado trees + ipês on the lawns (away from buildings and roads)
  const blocked = (x, z) => {
    if (Math.abs(x) < 21) return true;
    for (const [bx, bz, r] of slabs) {
      const hw = r ? 7 : 23;
      const hd = r ? 23 : 7;
      if (Math.abs(Math.abs(x) - bx) < hw + 2 && Math.abs(z - bz) < hd + 2) return true;
    }
    if (z < -120 && z > -470 && Math.abs(Math.abs(x) - 46) < 12) return true;
    if (z < -470 && Math.abs(x) < 60) return true;
    return false;
  };
  let placed = 0;
  let guard = 0;
  while (placed < 78 && guard++ < 2000) {
    const x = (R() < 0.5 ? -1 : 1) * (22 + R() * 110);
    const z = 70 - R() * 520;
    if (blocked(x, z)) continue;
    const a = new Asset(R() < 0.2 ? 'ipe' : 'tree', placed % 3, x, z, R() * 6.28, { band: 36, jitter: R() * 14 });
    const s = 0.85 + R() * 0.5;
    a.root.scale.setScalar(s);
    placed++;
  }
  // median ipês
  for (let z = 30; z > -420; z -= 38) new Asset('ipe', 0, 0, z, R() * 6.28, { band: 36 });
  HERO.tree = new Asset('tree', 1, -21.5, -46, 0.6, { band: 110 });
  HERO.tree.root.scale.setScalar(1.2);
  // crosswalk corner at z = -60: traffic lights, sign, bins, benches, cones
  new Asset('light', 0, -16, -54, 0, { band: 50 });
  new Asset('light', 0, 16, -66, Math.PI, { band: 50 });
  HERO.sign = new Asset('sign', 0, 18.6, -70, -Math.PI / 2, { band: 90 });
  // bus stops with benches/bins
  HERO.busstop = new Asset('busstop', 0, 18.2, -36, -Math.PI / 2, { band: 70 });
  new Asset('busstop', 0, -18.2, 16, Math.PI / 2, { band: 50 });
  for (const [x, z] of [
    [18.8, -30],
    [-18.8, 10],
    [18.8, -84],
    [-18.8, -96],
    [18.8, -130],
    [-18.8, -40],
  ]) {
    new Asset('bench', 0, x, z, x > 0 ? -Math.PI / 2 : Math.PI / 2, { band: 36 });
    new Asset('bin', 0, x, z + 3, 0, { band: 36 });
  }
  for (let i = 0; i < 6; i++) new Asset('cone', 0, -3.2 + (i % 3) * 0.9, -112 - Math.floor(i / 3) * 3, 0, { band: 30 });
  // the bus at the stop (callout target) and two moving buses
  HERO.bus = new Asset('bus', 0, 13.6, -40, 0, { band: 120 });
  const busA = new Asset('bus', 0, 10.2, 0, 0, { band: 60 });
  MOVERS.push({ a: busA, x: 10.2, z0: -260, dir: 1, v: 9, zmin: -560, zmax: 90 });
  const busB = new Asset('bus', 0, -12.6, 0, Math.PI, { band: 60 });
  MOVERS.push({ a: busB, x: -12.6, z0: 10, dir: -1, v: 10, zmin: -560, zmax: 90 });
  // traffic
  const lanes = [
    [6.5, 1],
    [10.2, 1],
    [-10.6, -1],
    [-13.2, -1],
  ];
  for (let i = 0; i < 26; i++) {
    const [x, dir] = lanes[i % lanes.length];
    const a = new Asset('car', i % 8, x, 0, dir > 0 ? 0 : Math.PI, { band: 44 });
    MOVERS.push({ a, x, z0: 80 - ((i * 97) % 640), dir, v: 11 + ((i * 37) % 7), zmin: -560, zmax: 90 });
  }
  // parked cars near the superquadras
  for (let i = 0; i < 12; i++) {
    const s = i % 2 ? 1 : -1;
    new Asset('car', (i + 3) % 8, s * (27 + (i % 3) * 2.6), 30 - Math.floor(i / 2) * 22, Math.PI / 2, { band: 40 });
  }
  // the two cars the saucer abducts: exactly under its path
  const p = new THREE.Vector3();
  ufoPos(0.95, p);
  firstCar = new Asset('car', 3, p.x, p.z - 1.5, 0.08, { band: 44 });
  ufoPos(9.05, p);
  heroCar = new Asset('car', 0, p.x, p.z - 0.8, -0.1, { band: 140 });
  HERO.car = heroCar;
  // the player
  HERO.ufo = new Asset('ufo', 0, 0, 0, 0, { band: 60 });
  HERO.ufo.root.scale.setScalar(0.72);
  HERO.ufo.blockout.castShadow = HERO.ufo.final.children[0].castShadow = true;
}

// GROUND (editor grid → finished streets) with the render-wave front
// ═══════════════════════════════════════════════════════════════════════════
const GROUND = { minX: -170, maxX: 170, minZ: -600, maxZ: 110 };
const groundTex = canvasTex(1024, 2140, (g, w, h) => {
  const sx = w / (GROUND.maxX - GROUND.minX);
  const sz = h / (GROUND.maxZ - GROUND.minZ);
  const X = (x) => (x - GROUND.minX) * sx;
  const Z = (z) => (z - GROUND.minZ) * sz;
  const rect = (x0, z0, x1, z1, c) => {
    g.fillStyle = c;
    g.fillRect(X(Math.min(x0, x1)), Z(Math.min(z0, z1)), Math.abs(X(x1) - X(x0)), Math.abs(Z(z1) - Z(z0)));
  };
  // lawns
  g.fillStyle = '#7a9a55';
  g.fillRect(0, 0, w, h);
  const r = rng(5);
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = r() < 0.5 ? 'rgba(40,80,20,0.12)' : 'rgba(180,210,90,0.10)';
    g.fillRect(r() * w, r() * h, 2 + r() * 5, 2 + r() * 5);
  }
  // dry cerrado patches
  for (let i = 0; i < 40; i++) {
    g.fillStyle = 'rgba(190,170,90,0.18)';
    g.beginPath();
    g.ellipse(r() * w, r() * h, 20 + r() * 60, 10 + r() * 30, r() * 3, 0, Math.PI * 2);
    g.fill();
  }
  // sidewalks + avenue + median
  rect(-18.5, -470, 18.5, 110, '#cfc8ba');
  rect(-15, -470, -4, 110, '#3b3e44');
  rect(4, -470, 15, 110, '#3b3e44');
  rect(-4, -470, 4, 110, '#76a04f');
  rect(-4.3, -470, -4, 110, '#e8e4d8');
  rect(4, -470, 4.3, 110, '#e8e4d8');
  // cross streets
  for (const zc of [-60, -200, -330])

      .replace('#include <common>', '#include <common>\n varying vec3 vWP; uniform float uWaveZ, uTime; uniform vec3 uGreen, uGreyBase; uniform sampler2D uDetail;')
      .replace(
        '#include <map_fragment>',
        `vec4 fin = texture2D( map, vMapUv );
         float lum = dot( fin.rgb, vec3( 0.3, 0.55, 0.15 ) );
         vec2 gp = vWP.xz;
         vec2 g1 = abs( fract( gp / 10.0 - 0.5 ) - 0.5 ) * 10.0;
         vec2 g2 = abs( fract( gp / 2.0 - 0.5 ) - 0.5 ) * 2.0;
         float major = 1.0 - smoothstep( 0.0, 0.09, min( g1.x, g1.y ) );
         float minor = 1.0 - smoothstep( 0.0, 0.04, min( g2.x, g2.y ) );
         vec3 grey = uGreyBase * ( 0.78 + 0.5 * lum );
         grey *= 1.0 - 0.18 * major - 0.06 * minor;
         float d = uWaveZ - vWP.z;
         float done = smoothstep( 0.0, 2.5, d );
         float dn = texture2D( uDetail, vWP.xz * 0.05 ).r;

      )

         float trail = step( 0.0, d ) * exp( -clamp( d, 0.0, 400.0 ) * 0.05 ) * ( major * 0.9 + minor * 0.25 );

function pointsMaterial(additive = true) {

    uniforms: { uScale: POINT_SCALE, uMaxPx: POINT_MAX, uGreen: SHARED.uGreen },
    vertexShader: `attribute float aA; attribute float aS; varying float vA; uniform float uScale;
      uniform float uMaxPx;
      void main(){ vA = aA; vec4 mv = modelViewMatrix * vec4(position,1.0); gl_PointSize = min(aS * uScale / max(-mv.z, 0.5), uMaxPx); if (-mv.z < 3.0) vA *= max(0.0, (-mv.z - 1.0) / 2.0); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying float vA; uniform vec3 uGreen;
      void main(){ vec2 c = gl_PointCoord - 0.5; float d = length(c); if (d > 0.5) discard; float a = vA * (1.0 - smoothstep(0.1, 0.5, d)); gl_FragColor = vec4(mix(uGreen, vec3(1.0), 0.35) * 1.8, a); }`,
    transparent: true,
    depthWrite: false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
  });
}

}

function assignParticles() {
  const r = rng(99);
  const heroes = new Set(Object.values(HERO));
  const pool = [];
  for (const a of ASSETS) pool.push({ a, w: heroes.has(a) ? 40 : a.type === 'slab' || a.type === 'ministry' ? 10 : 3 });
  const total = pool.reduce((s, p) => s + p.w, 0);
  PARTS = [];
  for (const p of pool) {
    const n = Math.max(1, Math.round((p.w / total) * CONFIG.particleCount));
    const bb = p.a.g.blockoutBB;
    for (let i = 0; i < n && PARTS.length < CONFIG.particleCount; i++) {
      const end = p.a.g.samples[Math.floor(r() * p.a.g.samples.length)];
      const start = new THREE.Vector3(lerp(bb.min.x, bb.max.x, r()), lerp(bb.min.y, bb.max.y, r()), lerp(bb.min.z, bb.max.z, r()));
      const hn = clamp((end.y - p.a.g.bb.min.y) / Math.max(0.1, p.a.g.bb.max.y - p.a.g.bb.min.y));
      PARTS.push({ a: p.a, start, end, delay: hn * 0.35 + r() * 0.08, size: 0.18 + r() * 0.22 });
    }
  }
}

// POST: bloom + grade (saturation/contrast/vignette/grain/flash)
// ═══════════════════════════════════════════════════════════════════════════
let composer = null;
let bloom = null;
let grade = null;
function setupPost() {
  composer = new EffectComposer(renderer);
  composer.setSize(W, H);
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.3, 0.55, 0.82);
  bloom.enabled = CONFIG.enableBloom;
  composer.addPass(bloom);
  grade = new ShaderPass({
    uniforms: {
      tDiffuse: { value: null },
      uSat: { value: 1 },
      uContrast: { value: 1 },
      uExposure: { value: 1 },
      uVig: { value: 0.35 },
      uGrain: { value: CONFIG.enableGrain ? 0.045 : 0 },
      uScan: { value: CONFIG.enableScanlines ? 0.06 : 0 },
      uTime: { value: 0 },
      uFlash: { value: 0 },
      uFlashCol: { value: GREEN.clone() },
      uCA: { value: 0 },
      uRes: { value: new THREE.Vector2(W, H) },
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
      uniform float uSat, uContrast, uExposure, uVig, uGrain, uScan, uTime, uFlash, uCA; uniform vec3 uFlashCol; uniform vec2 uRes;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
      void main(){
        vec2 dir = vUv - 0.5;
        vec3 c;
        c.r = texture2D(tDiffuse, vUv + dir * uCA).r;
        c.g = texture2D(tDiffuse, vUv).g;
        c.b = texture2D(tDiffuse, vUv - dir * uCA).b;
        c *= uExposure;
        float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
        c = mix(vec3(l), c, uSat);
        c = (c - 0.18) * uContrast + 0.18;
        float v = 1.0 - smoothstep(0.25, 0.95, length(dir * vec2(0.9, 1.0)));
        c *= mix(1.0, v, uVig);
        c += uFlashCol * uFlash;
        float n = hash(vUv * uRes + fract(uTime * 13.7) * 91.0) - 0.5;
        c += n * uGrain;
        c *= 1.0 - uScan * step(0.5, fract(vUv.y * uRes.y * 0.5));
        gl_FragColor = vec4(max(c, 0.0), 1.0);
      }`,
  });
  composer.addPass(grade);
  composer.addPass(new OutputPass());
}

const CAM = [

  [1.2, [3.4, 6.6, 17], [0, -4.6, -12]],
  [2.3, [-10, 8.2, 14.5], [0.5, -3.5, -16]],
  [3.2, [-13.5, 22, 27], [2, -6, -58]],
  [4.05, [-14.2, 30, 33], [4, -8.5, -76]],
  [5.55, [-13.4, 28.6, 31], [4, -8.5, -76]],
  [6.6, [-7, 17, 24], [1, -5.5, -62]],
  [8.1, [4.6, 9, 18.5], [0, -4.2, -38]],
  [9.0, [6.4, 7.6, 21], [0.6, -2.8, -8]],

function hermite(p0, p1, m0, m1, k) {

    [5.95, 0.8],

function carryPath(a, t, t0, t1, from, target) {

function renderAt(t) {

  // ── traffic

    const z = (((m.z0 + m.dir * m.v * T - m.zmin) % span) + span) % span + m.zmin;
    m.a.root.position.set(m.x, 0, z);
  }

  const ufo = HERO.ufo;
  ufo.root.position.copy(U0);
  const dx = ufoX(T + 0.05) - ufoX(T - 0.05);
  ufo.root.rotation.set(-0.1, T * 0.9, -dx * 0.9);

  // ── abductions
  if (!firstCar.baseRot) firstCar.baseRot = firstCar.root.rotation.y;
  if (!heroCar.baseRot) heroCar.baseRot = heroCar.root.rotation.y;
  if (!firstCar.home) firstCar.home = firstCar.root.position.clone();
  if (!heroCar.home) heroCar.home = heroCar.root.position.clone();
  if (t >= 0.72) {
    carryPath(firstCar, t, 0.72, 1.95, firstCar.home, U0);
    firstCar.root.visible = t < 1.95;
  } else {
    firstCar.root.position.copy(firstCar.home);
    firstCar.root.rotation.set(0, firstCar.baseRot, 0);
    firstCar.root.scale.setScalar(1);
    firstCar.root.visible = true;
  }
  firstCarAnchor.copy(U0).add(tmpV.set(0, 2.5, 0));
  if (t >= 9.08) carryPath(heroCar, t, 9.08, 10.3, heroCar.home, U0);
  else {
    heroCar.root.position.copy(heroCar.home);
    heroCar.root.rotation.set(0, heroCar.baseRot, 0);
    heroCar.root.scale.setScalar(1);
  }
  heroAnchor.copy(heroCar.root.position).add(tmpV.set(0, 3.2, 0));

  // ── beam
  const beamOn = Math.max(sub(t, 0.52, 0.66) * (1 - sub(t, 1.95, 2.25)), sub(t, 8.98, 9.12));
  beam.mat.uniforms.uOn.value = beamOn;
  beam.cone.visible = beam.disc.visible = beamOn > 0.001;
  beam.cone.position.copy(U0).add(tmpV.set(0, -0.6, 0));
  beam.cone.scale.set(1, U0.y - 0.6, 1);
  beam.disc.position.set(U0.x, 0.06, U0.z);
  ufoLight.position.copy(U0).add(tmpV.set(0, -1.5, 0));
  ufoLight.intensity = (beamOn * 60 + 12) * (override === 'blockout' ? 0.5 : 1);

  // ── render wave: per-asset transformation progress
  const wz = override === 'final' ? 1e4 : override === 'blockout' ? -1e4 : waveZ(t);
  let done = 0;
  for (const a of ASSETS) {
    const p = clamp((wz - (a.zFront + a.jitter)) / a.band);
    a.doneAge = p >= 1 ? (a.doneAt === undefined ? 0 : t - a.doneAt) : 0;
    if (p >= 1 && a.doneAt === undefined) a.doneAt = t;

  waveWall.visible = waveWall.material.uniforms.uA.value > 0.001;

  const G = override === 'final' ? 1 : override === 'blockout' ? 0 : envMix(t);

  ground.OU.uMix.value = G;
  hemi.color.set('#dfe3e6').lerp(tmpColA.set('#bfe4ff'), G);
  hemi.groundColor.set('#8b8e90').lerp(tmpColA.set('#6f6a4a'), G);
  hemi.intensity = lerp(2.4, 1.05, G);
  sun.color.set('#ffffff').lerp(tmpColA.set('#ffe7c2'), G);
  sun.intensity = lerp(0.55, 2.5, G);
  scene.fog.color.set('#aeb3b6').lerp(tmpColA.set('#b9dbef'), G);
  scene.fog.density = lerp(0.0021, 0.0015, G);

  const sh = shakeAt(t);

  camera.position.y += Math.sin(t * 29.7 + 1) * sh * 0.4;
  // gentle handheld drift so no frame is ever dead still
  camera.position.x += Math.sin(t * 0.9) * 0.18;
  camera.position.y += Math.sin(t * 1.3 + 2) * 0.12;
  camera.lookAt(tmpV.copy(U0).add(look));
  camera.fov = lerp(52, 47, sub(t, 8.6, 10)) + lerp(0, 6, sub(t, 2.6, 3.8)) * (1 - sub(t, 5.8, 7.0));

  const ps = bp.attributes.aS.array;

    u.uContrast.value = lerp(0.96, 1.1, G);
    u.uExposure.value = lerp(1, 0.86, empty) * lerp(1, 1.04, G);

const tmpColA = new THREE.Color();

// project a world point to stage pixels (fx canvas resolution)
function project(v, out = { x: 0, y: 0, z: 0 }) {
  tmpV.copy(v).project(camera);
  out.x = (tmpV.x * 0.5 + 0.5) * W;
  out.y = (-tmpV.y * 0.5 + 0.5) * H;
  out.z = tmpV.z;
  return out;
}
function assetScreenBox(a) {
  const bb = a.g.blockoutBB;
  let x0 = Infinity;
  let y0 = Infinity;
  let x1 = -Infinity;
  let y1 = -Infinity;
  let front = false;
  a.root.updateMatrixWorld();
  for (let i = 0; i < 8; i++) {
    tmpV2.set(i & 1 ? bb.max.x : bb.min.x, i & 2 ? bb.max.y : bb.min.y, i & 4 ? bb.max.z : bb.min.z).applyMatrix4(a.root.matrixWorld);

    if (p.z < 1) front = true;
    x0 = Math.min(x0, p.x);
    y0 = Math.min(y0, p.y);
    x1 = Math.max(x1, p.x);
    y1 = Math.max(y1, p.y);
  }

}
const topOf = (a, out) => {
  const bb = a.g.bb;

function placeLabel(el, x, y, show, extra = '', side = 1) {
  el.style.opacity = show ? '1' : '0';
  // keep tags inside the Reels safe area (Instagram UI covers the right edge and the bottom)
  const w = el.offsetWidth || 0;
  const px = (x / W) * 1080 * U;
  const minX = 60 * U + (side < 0 ? w : 0);
  const maxX = 1080 * U - 160 * U - (side > 0 ? w : 0);
  el.style.transform = `translate(${clamp(px, minX, maxX)}px, ${(y / H) * 1920 * U}px) ${extra}`;
}

function drawOverlay(t, doneCount) {
  const c = fxc;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, W, H);
  const k = W / 1080; // overlay units → px
  const G = override ? (override === 'final' ? 1 : 0) : envMix(t);
  const live = !override;

  // top-left system tag + counters
  const tagTxtNow = t < 5.75 ? 'GAMEPLAY PROTOTYPE' : t < 9.05 ? '3D PIPELINE · TRIPO' : 'FINAL BUILD';
  if (tagTxt.textContent !== tagTxtNow) tagTxt.textContent = tagTxtNow;
  tag.classList.toggle('live', t >= 5.75);
  tag.style.opacity = String(live ? sub(t, 0.15, 0.45) : 0);
  const totalAssets = ASSETS.length - 1;
  if (live && t >= 4.7 && t < 5.75) {
    const n = Math.round(easeOutCubic(sub(t, 4.7, 5.25)) * totalAssets);

    counter.style.opacity = '1';
  } else if (live && t >= 5.9 && t < 9.1) {
    counter.className = doneCount >= totalAssets ? 'ok' : '';

    counter.style.opacity = '1';

  hudNum.style.transform = `scale(${1 + bump * 0.35})`;

    for (const a of sorted) {

      const kk = easeOutCubic(sub(t, delay, delay + 0.18)) * fadeProblem;

      c.beginPath();

        [b.x1, b.y0, -1, 1],
        [b.x0, b.y1, 1, -1],
        [b.x1, b.y1, -1, -1],

      for (const [x, y, sx, sy] of corners) {

    const b = assetScreenBox(co.a);

    c.lineTo(lx, ly);
    c.stroke();
    c.beginPath();
    c.arc(ax, ay, 5 * k, 0, Math.PI * 2);
    c.fill();
    co.el.style.opacity = String(e);

    c.shadowColor = '#8cff00';
    c.shadowBlur = 30 * k;
    c.fillRect(0, y - 1 * k, W, 2 * k);
    c.shadowBlur = 0;

    c.fillStyle = 'rgba(140,255,0,0.9)';
    c.fillText('SCANNING SCENE · 3D PIPELINE', 64 * k, y - 16 * k);
  }
  const pin = easeOutExpo(sub(t, 5.72, 6.05));
  const pout = easeInCubic(sub(t, 6.95, 7.25));
  const pipeOn = live && t > 5.7 && t < 7.3;
  vis(pipe, pipeOn);
  if (pipeOn) {
    pipe.style.opacity = String(1 - pout);
    pipe.style.clipPath = `inset(0 0 ${(1 - pin) * 100}% 0)`;
    pipe.style.transform = `translateY(${(1 - pin) * -20 * U + pout * -30 * U}px)`;
    pipeSteps.forEach((s, i) => {
      const st = 5.82 + i * 0.16;
      const on = t > st;
      s.style.opacity = on ? '1' : '0.15';
      s.classList.toggle('hot', on && t < st + 0.35 + (i === 2 ? 9 : 0));
    });
    pipeArrows.forEach((a, i) => (a.style.opacity = t > 5.9 + i * 0.16 ? '1' : '0.15'));
  }

  // ── BUILD: stage labels on hero assets
  for (const s of STAGELABELS) {
    const p = s.a.p;
    const stage = s.stages.find(([, a, b]) => p >= a && p < b);
    let text = stage ? stage[0] : null;
    let isDone = false;
    if (!text && p >= 1 && s.a.doneAge < 0.45) {
      text = 'EXPORT: GLB';
      isDone = true;
    }
    if (text === 'READY') isDone = true;
    const on = live && t >= 5.6 && t < 8.95 && text;
    if (!on) {
      s.el.style.opacity = '0';
      continue;
    }
    const top = project(topOf(s.a, tmpV2));
    if (top.z > 1 || top.x < -50 || top.x > W + 50 || top.y < 340 * k || top.y > H - 300 * k) {
      s.el.style.opacity = '0';
      continue;
    }
    if (s.el.textContent !== text) s.el.textContent = text;
    s.el.classList.toggle('done', isDone);
    const lx = top.x + s.side * 34 * k;
    const ly = top.y - 42 * k;
    c.strokeStyle = 'rgba(140,255,0,0.85)';
    c.lineWidth = 2 * k;
    c.beginPath();
    c.moveTo(top.x, top.y);
    c.lineTo(lx, ly);
    c.stroke();
    c.fillStyle = '#8cff00';
    c.fillRect(top.x - 3 * k, top.y - 3 * k, 6 * k, 6 * k);
    placeLabel(s.el, lx, ly, true, `translate(${s.side > 0 ? 0 : -100}%, -100%)`, s.side);
  }

  // subtle frame marks (editor viewport corners) during the prototype beats
  const frameA = live ? (1 - G) * 0.35 : 0;
  if (frameA > 0.01) {
    c.strokeStyle = `rgba(255,255,255,${frameA})`;
    c.lineWidth = 2 * k;
    const m = 40 * k;
    const l = 40 * k;
    c.beginPath();
    for (const [x, y, sx, sy] of [
      [m, m, 1, 1],
      [W - m, m, -1, 1],
      [m, H - m, 1, -1],
      [W - m, H - m, -1, -1],
    ]) {
      c.moveTo(x, y + sy * l);
      c.lineTo(x, y);
      c.lineTo(x + sx * l, y);
    }
    c.stroke();
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// PLAYBACK (recording, loop, keyboard, frame-exact capture API)
// ═══════════════════════════════════════════════════════════════════════════
let playing = !CAPTURE;
let t = 0;
let lastNow = 0;
function tick(now) {
  requestAnimationFrame(tick);
  const dt = lastNow ? Math.min(0.1, (now - lastNow) / 1000) : 0;
  lastNow = now;
  if (!playing) return;
  t += dt;
  if (t > CONFIG.duration) {
    if (RECORDING_MODE && !override) {
      t = CONFIG.duration;
      playing = false;
      document.title = 'ABDUZIU × TRIPO — DONE';
      window.dispatchEvent(new Event('reel-done'));
    } else t = override ? t % CONFIG.duration : 0;
  }
  renderAt(t);
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyR') {
    override = null;
    t = 0;
    playing = true;
  } else if (e.code === 'Space') {
    e.preventDefault();
    playing = !playing;
    if (playing && t >= CONFIG.duration) t = 0;
  } else if (e.code === 'Digit1') override = 'blockout';
  else if (e.code === 'Digit2') override = 'final';
  else if (e.code === 'Digit3') {
    override = null;
    t = CONFIG.transformationStart - 0.4;
    playing = true;
  } else if (e.code === 'KeyC') document.body.classList.toggle('show-cursor');
  if (!playing) renderAt(t);
});
window.addEventListener('resize', () => {
  layout();
  fitHeadlines();
  renderAt(t);
});

window.REEL = {
  debug: () => ({ scene, renderer, camera, bloom, grade, ground, ASSETS }),
  duration: CONFIG.duration,
  fps: 60,
  ready: false,
  renderAt(time) {
    t = time;
    renderAt(time);
  },
  play() {
    playing = true;
  },
  pause() {
    playing = false;
  },
  seek(time) {
    t = time;
    renderAt(t);
  },
};

async function boot() {
  layout();
  try {
    await Promise.all([document.fonts.load('italic 900 80px "Barlow Condensed"'), document.fonts.load('700 20px "Chakra Petch"'), document.fonts.load('600 20px "Chakra Petch"')]);
  } catch {
    /* fallbacks render fine */
  }
  signTex.needsUpdate = true;
  busTex.needsUpdate = true;
  // Tripo GLBs replace the procedural finals before the city is built
  for (const [name, url] of Object.entries(ASSET_GLBS)) {
    if (!url) continue;
    try {
      await loadFinalAsset(name, url);
    } catch (err) {
      console.warn(`[ABDUZIU] GLB "${name}" não carregou, usando o procedural.`, err);
    }
  }
  fitHeadlines();
  buildCity();
  assignParticles();
  setupPost();
  setupLabels();
  layout();
  renderAt(0);
  try {
    await renderer.compileAsync(scene, camera);
  } catch {
    /* compile on first frames */
  }
  renderAt(0);
  document.getElementById('boot').remove();
  window.REEL.ready = true;
  if (!CAPTURE) {
    t = 0;
    lastNow = 0;
    requestAnimationFrame(tick);
  }
}
boot();
</script>
