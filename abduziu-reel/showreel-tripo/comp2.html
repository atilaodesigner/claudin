<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ABDUZIU × Tripo — motion v2</title>
<style>
@font-face { font-family: UB; src: url(fonts/unbounded-latin-900-normal.woff2); font-weight: 900; }
@font-face { font-family: UB; src: url(fonts/unbounded-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: UB; src: url(fonts/unbounded-latin-500-normal.woff2); font-weight: 500; }
@font-face { font-family: SM; src: url(fonts/space-mono-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: SM; src: url(fonts/space-mono-latin-400-normal.woff2); font-weight: 400; }
@font-face { font-family: AR; src: url(fonts/archivo-latin-800-normal.woff2); font-weight: 800; }
@font-face { font-family: AR; src: url(fonts/archivo-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: AR; src: url(fonts/archivo-latin-600-normal.woff2); font-weight: 600; }

/* Brasília modernista × sci-fi: concreto, azulejo Bulcão, feixe verde, amarelo Tripo */
:root {
  --concrete: #ece8df;
  --concrete2: #dcd6c9;
  --ink: #0f1013;
  --ink2: #1a1c22;
  --beam: #2bff88;
  --azul: #1d4ed8;
  --amarelo: #ffc300;
  --tripo: #ffd23f;
  --violet: #7b61ff;
  --paper: #fffdf8;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
#stage { position: absolute; inset: 0; overflow: hidden; transform-origin: 540px 960px; }
.scene { position: absolute; inset: 0; overflow: hidden; perspective: 2400px; display: none; }
.full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
.fill { position: absolute; inset: 0; }
.abs { position: absolute; left: 0; top: 0; }
.grp { position: absolute; inset: 0; }
.bp { background-color: var(--ink); background-image:
  linear-gradient(rgba(255,255,255,.045) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.045) 2px, transparent 2px);
  background-size: 60px 60px; }

.card { position: absolute; left: 0; top: 0; overflow: hidden; border-radius: 22px; background: #15171c;
  box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.12); transform-origin: 50% 50%; backface-visibility: hidden; }
.card img { position: absolute; left: 0; top: 0; max-width: none; }
.card.g { box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 3px var(--beam); }
.card.y { box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 3px var(--tripo); }
.card.lt { box-shadow: 0 30px 70px rgba(15,16,19,.28), 0 0 0 3px var(--ink); }
.card.round { border-radius: 50%; }
.sprite { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
.sprite img { width: 100%; height: 100%; object-fit: contain; display: block; }

/* type */
.h { position: absolute; left: 0; width: 1080px; text-align: center; font-family: UB; font-weight: 900; text-transform: uppercase;
  color: var(--ink); line-height: 1.0; letter-spacing: -.035em; }
.h.left { text-align: left; padding-left: 64px; }
.h.wht { color: #fff; }
.h .ln { display: block; white-space: nowrap; }
.h .w { display: inline-block; overflow: hidden; vertical-align: top; padding: .14em .04em .1em; margin: -.14em -.02em -.1em; }
.h .w > span { display: inline-block; will-change: transform; }
.h.wht .w > span { text-shadow: 0 6px 30px rgba(0,0,0,.55); }
.h .hl > span { background: var(--beam); color: var(--ink); padding: 0 .14em; text-shadow: none; }
.h .hb > span { background: var(--azul); color: #fff; padding: 0 .14em; text-shadow: none; }
.h .hy > span { background: var(--amarelo); color: var(--ink); padding: 0 .14em; text-shadow: none; }
.h .hk > span { background: var(--ink); color: #fff; padding: 0 .14em; text-shadow: none; }
.h .gr > span { color: var(--beam); }
.h .bl > span { color: var(--azul); }
.h .ol > span { color: transparent; -webkit-text-stroke: 3px currentColor; }
.h .vid > span { color: transparent; -webkit-background-clip: text; background-clip: text; background-size: 1080px 1920px; text-shadow: none; }
.mono { font-family: SM; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.cap { position: absolute; left: 64px; width: 952px; font-family: AR; font-weight: 600; font-size: 46px; line-height: 1.12; color: rgba(255,255,255,.88); }
.cap b { color: var(--beam); font-weight: 800; }

/* chips */
.chip { position: absolute; left: 0; top: 0; font-family: SM; font-weight: 700; font-size: 28px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink); background: var(--beam); padding: 12px 20px 10px; border-radius: 999px; white-space: nowrap; box-shadow: 0 14px 34px rgba(0,0,0,.4); }
.chip.k { background: var(--ink); color: #fff; border: 2px solid rgba(255,255,255,.3); }
.chip.y { background: var(--tripo); }
.chip.v { background: var(--violet); color: #fff; }
.chip.b { background: var(--azul); color: #fff; }
.chip.w { background: #fff; }
.chip svg { width: 1em; height: 1em; vertical-align: -.14em; margin: 0 .2em; }

/* feature header */
.fidx { position: absolute; left: 64px; top: 190px; font-family: SM; font-weight: 700; font-size: 150px; line-height: 1; color: var(--beam); letter-spacing: -.04em; }
.fidx small { font-size: 42px; color: rgba(255,255,255,.5); letter-spacing: 0; margin-left: 10px; }
.fname { position: absolute; left: 64px; top: 360px; font-family: UB; font-weight: 900; font-size: 70px; line-height: 1; color: #fff; text-transform: uppercase; letter-spacing: -.03em; white-space: nowrap; }
.dots { position: absolute; right: 64px; top: 210px; display: flex; gap: 10px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); }
.dots i.on { background: var(--beam); border-color: var(--beam); }
.dots i.cur { box-shadow: 0 0 0 5px rgba(43,255,136,.35); }

/* hud */
#hud { position: absolute; left: 64px; right: 64px; top: 100px; height: 60px; mix-blend-mode: difference; color: #fff; }
#hud .l, #hud .r { position: absolute; top: 0; font-family: SM; font-weight: 700; font-size: 24px; letter-spacing: .08em; white-space: nowrap; }
#hud .r { right: 0; }
#hud .rule { position: absolute; left: 0; right: 0; top: 44px; height: 3px; background: rgba(255,255,255,.35); }
#prog { position: absolute; left: 64px; top: 144px; height: 3px; background: var(--beam); }
#bars { position: absolute; inset: 0; pointer-events: none; }
#bars i { position: absolute; top: 0; height: 1920px; width: 136px; }
#flash { position: absolute; inset: 0; pointer-events: none; }
#grain { position: absolute; inset: -64px; pointer-events: none; opacity: .07; mix-blend-mode: overlay; }

/* misc */
.ring { position: absolute; left: 0; top: 0; border-radius: 50%; border: 3px solid var(--ink); }
.ticks { position: absolute; left: 0; top: 0; border-radius: 50%; }
.logo { position: absolute; left: 0; width: 1080px; text-align: center; font-family: UB; font-weight: 900; font-size: 104px; letter-spacing: -.04em; line-height: 1; color: #fff; white-space: nowrap; }
.logo span { color: var(--beam); }
.strip { position: absolute; top: 0; overflow: hidden; background: #222; }
.strip img { position: absolute; top: 0; max-width: none; }
.tilegrid { position: absolute; left: 0; top: 0; }
.tile { position: absolute; width: 180px; height: 180px; transform-style: preserve-3d; }
.tile .f, .tile .b { position: absolute; inset: 0; backface-visibility: hidden; }
.tile .b { transform: rotateY(180deg); background: var(--paper); }
.tile .b img { position: absolute; inset: 10px; width: 160px; height: 160px; object-fit: contain; }
.counter { position: absolute; left: 64px; font-family: UB; font-weight: 900; font-size: 150px; letter-spacing: -.05em; color: #fff; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.counter small { font-family: SM; font-size: 38px; letter-spacing: .1em; color: var(--beam); margin-left: 18px; }
.slider { position: absolute; left: 64px; width: 952px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.18); }
.slider .fb { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--beam); }
.slider .kn { position: absolute; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 6px rgba(43,255,136,.45); }
.slider .lo, .slider .hi { position: absolute; top: 26px; font-family: SM; font-weight: 700; font-size: 26px; color: rgba(255,255,255,.6); }
.slider .hi { right: 0; }
.selbox { position: absolute; left: 0; top: 0; border: 5px dashed var(--beam); border-radius: 8px; }
.selbox .fx { position: absolute; inset: 0; overflow: hidden; }
.selbox .q { position: absolute; inset: 0; background-image:
  linear-gradient(rgba(43,255,136,.9) 2px, transparent 2px), linear-gradient(90deg, rgba(43,255,136,.9) 2px, transparent 2px); background-size: 34px 34px; }
.selbox .bar { position: absolute; left: 0; right: 0; height: 60px; background: linear-gradient(rgba(43,255,136,0), rgba(43,255,136,.85), #fff); }
.prompt { position: absolute; left: 0; top: 0; width: 952px; height: 100px; border-radius: 22px; background: #fff; color: var(--ink); font-family: SM; font-weight: 700;
  font-size: 36px; padding: 28px 32px; white-space: nowrap; box-shadow: 0 0 0 4px var(--violet), 0 20px 60px rgba(123,97,255,.35); }
.file { position: absolute; left: 0; top: 0; width: 520px; height: 150px; border-radius: 24px; background: #fff; color: var(--ink); display: flex; align-items: center;
  gap: 22px; padding: 0 30px; font-family: SM; font-weight: 700; font-size: 34px; box-shadow: 0 30px 70px rgba(0,0,0,.5); white-space: nowrap; }
.file .badge { width: 96px; height: 96px; border-radius: 18px; background: var(--violet); color: #fff; font-family: UB; font-weight: 900; font-size: 30px;
  display: flex; align-items: center; justify-content: center; }
.flow { position: absolute; left: 0; width: 1080px; display: flex; justify-content: center; align-items: center; gap: 8px; }
.flow .st { font-family: SM; font-weight: 700; font-size: 26px; padding: 10px 16px 8px; border-radius: 999px; color: #fff; background: rgba(15,16,19,.6); border: 2px solid rgba(255,255,255,.35); white-space: nowrap; }
.flow .st.on { color: var(--ink); background: var(--beam); border-color: var(--beam); }
.flow svg { width: 24px; height: 24px; color: #fff; }
.toast { position: absolute; left: 0; top: 0; font-family: SM; font-weight: 700; font-size: 32px; color: var(--ink); background: var(--beam); border-radius: 999px; padding: 14px 28px 12px; white-space: nowrap; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
.sticker { position: absolute; left: 0; width: 1080px; text-align: center; }
.sticker > span { display: inline-block; font-family: UB; font-weight: 900; font-size: 58px; text-transform: uppercase; color: #fff; background: var(--ink);
  padding: 18px 30px 16px; letter-spacing: -.02em; white-space: nowrap; border-radius: 6px; }
.lens { position: absolute; left: 0; top: 0; border-radius: 50%; overflow: hidden; }
.codebox { position: absolute; left: 0; top: 0; width: 952px; height: 270px; border-radius: 30px; background: var(--ink); }
.codebox .lb { position: absolute; left: 0; right: 0; top: 30px; text-align: center; font-family: SM; font-weight: 700; font-size: 30px; letter-spacing: .2em; color: var(--tripo); }
.codebox .code { position: absolute; left: 0; right: 0; top: 88px; display: flex; justify-content: center; gap: 22px; }
.codebox .code span { display: inline-block; text-align: center; font-family: UB; font-weight: 900; font-size: 118px; line-height: 150px; color: #fff; }
.step { position: absolute; left: 64px; width: 952px; display: flex; gap: 24px; align-items: center; font-family: AR; font-weight: 700; font-size: 46px; line-height: 1.1; color: var(--ink); }
.step .n { flex: none; width: 76px; height: 76px; border-radius: 50%; background: var(--ink); color: var(--tripo); font-family: UB; font-weight: 900; font-size: 38px;
  display: flex; align-items: center; justify-content: center; }
.warn { position: absolute; left: 64px; width: 952px; border-radius: 22px; background: var(--ink); color: #fff; padding: 26px 30px 24px 108px; font-family: AR; font-weight: 600; font-size: 40px; line-height: 1.12; }
.warn b { color: var(--tripo); }
.warn svg { position: absolute; left: 30px; top: 30px; width: 54px; height: 54px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="comp2.js"></script>
</body>
</html>
