# Publica o GINGA ARENA na Cloudflare a cada push que mexe em ginga-arena/:
#   - servidor de partidas: Worker "ginga-arena-server" (Durable Objects, uma sala por código)
#   - site: Cloudflare Pages "ginga-arena" (ginga-arena.pages.dev), /api/* → Worker (service binding)
# Usa os mesmos segredos do deploy do ABDUZIU: CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
name: Deploy GINGA ARENA

on:
  push:
    branches: [main, claude/determined-shannon-30hwyw]
    paths: ['ginga-arena/**', '.github/workflows/deploy-ginga-arena.yml']
  workflow_dispatch:

concurrency:
  group: deploy-ginga-arena
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ginga-arena
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ginga-arena/package-lock.json

      - name: Instalar e testar
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build do site (backend edge)
        run: VITE_BACKEND=edge npm run build

      - name: Publicar o servidor de partidas (Worker + Durable Objects)
        working-directory: ginga-arena/packages/edge
        run: npm run deploy

      - name: Criar o projeto no Cloudflare Pages (se ainda não existir)
        working-directory: ginga-arena/packages/client
        run: npx wrangler pages project create ginga-arena --production-branch=main || echo "projeto já existe"

      - name: Publicar o site
        working-directory: ginga-arena/packages/client
        run: npx wrangler pages deploy --project-name=ginga-arena --branch=main --commit-dirty=true

      - name: Conferir
        run: |
          sleep 15
          for u in "https://ginga-arena.pages.dev" "https://ginga-arena.pages.dev/api/health"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u")
            echo "$u → $code"
            [ "$code" = "200" ] || exit 1
          done
          curl -s -X POST https://ginga-arena.pages.dev/api/new
