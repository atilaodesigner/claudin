# Publica o jogo BSBass Drift Game no Cloudflare Pages (bsbass-drift.pages.dev) a cada push na main.
# O site da marca (bsbass/site, bsbass.fun) tem o próprio deploy em deploy-bsbass.yml.
# Usa os mesmos segredos do deploy do ABDUZIU:
#   CLOUDFLARE_API_TOKEN   token com Account › Cloudflare Pages › Edit
#   CLOUDFLARE_ACCOUNT_ID  ID da conta
name: Deploy BSBass Drift Game

on:
  push:
    branches: [main]
    paths: ['bsbass/**', '!bsbass/site/**', '.github/workflows/deploy-bsbass-game.yml']
  workflow_dispatch:

concurrency:
  group: deploy-bsbass-game
  cancel-in-progress: true

env:
  PROJECT: bsbass-drift

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bsbass/package-lock.json

      - name: Instalar, testar e buildar
        working-directory: bsbass
        run: |
          npm ci
          npm test
          npm run build

      - name: Criar o projeto no Cloudflare Pages (se ainda não existir)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || echo "projeto já existe"

      - name: Publicar
        working-directory: bsbass
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true
